<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - BuscaTuIA</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link rel="stylesheet" href="style/Style.css"> 

</head>
<body>
    
    <header>
        <div class="logo-contenedor">
            <img src="Imagenes/logo.jpg" alt="logo del sitio" class="logo-img">
            
            <h2 class="logo-texto">BuscaTuIA</h2>
        </div>
       <nav>
    <a href="index.html">Inicio</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="precios.html">Precios</a>
    <a href="ayuda.html">Ayuda</a>
    <a href="acerca.html">Acerca de</a>
    <a href="login.html" style="color: #00ff80; text-decoration: underline; font-weight: bold;">Acceder/Registrarse</a>
    <a href="perfil.html" id="userDisplayLink" style="text-decoration: none; display: none;">
        <div id="userAvatar" style="width: 40px; height: 40px; background-color: #e91e63; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; margin-left: 15px; border: 2px solid white;">
            </div>
              </a>
                 <a href="#" id="btnLogout" style="font-size: 14px; color: #dc3545; display: none; margin-left: 10px; text-decoration: none;">Salir</a>
          </nav>
    </header>

    <div class="main-content">
        <main class="form-signin text-center">
            <form id="formLogin">
                <img class="mb-4" src="Imagenes/logo.jpg" alt="Logo BuscaTuIA" width="80" height="auto">
                
                <h1 class="h3 fw-normal">Bienvenido de nuevo</h1>

                <div class="form-floating">
                    <input type="email" class="form-control" id="inputEmail" placeholder="name@example.com">
                    <label for="inputEmail">Correo Electrónico</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" id="inputPassword" placeholder="Password">
                    <label for="inputPassword">Contraseña</label>
                </div>

                <div class="checkbox mb-3 checkbox-mb">
                    <label>
                        <input type="checkbox" value="remember-me"> Recordarme
                    </label>
                </div>

                     <div id="loginErrorMsg" class="text-danger text-center mb-3 fw-bold" style="display: none; font-size: 0.9rem;"></div>

                        

                <button class="w-100 btn btn-lg btn-primary" type="submit" id="btnSignIn">Iniciar Sesión</button>
                
                <p class="register-link">¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>

                <a href="index.html" class="back-link">← Volver al inicio</a>

                <p class="footer-text">&copy; 2025 BuscaTuIA</p>
            </form>
        </main>
    </div>

   
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="Script/Script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    






<button class="btn btn-primary btn-config" data-bs-toggle="modal" data-bs-target="#modalConfig">
        ⚙️
    </button>

    <div class="modal fade" id="modalConfig" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" style="color: black;">Configuración</h5> <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="color: black;">
                    
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="switchDarkMode">
                        <label class="form-check-label" for="switchDarkMode">Modo Oscuro</label>
                    </div>

                    <div class="mb-3">
                        <label for="rangeFontSize" class="form-label">Tamaño de letra</label>
                        <input type="range" class="form-range" min="1" max="3" step="1" id="rangeFontSize" value="1">
                        <div class="d-flex justify-content-between">
                            <small>Normal</small>
                            <small>Grande</small>
                            <small>Extra</small>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    

</body>
</html>
