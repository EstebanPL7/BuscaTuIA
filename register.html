<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - BuscaTuIA</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="style/Style.css"> 
</head>
<body>
    
    <header>
        <div class="logo-contenedor">
            <img src="Imagenes/logo.jpg" alt="logo del sitio" class="logo-img">
            <h2 class="logo-texto">BuscaTuIA</h2>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="precios.html">Precios</a>
            <a href="ayuda.html">Ayuda</a>
            <a href="acerca.html">Acerca de</a>
            <a href="login.html" style="color: #00ff80; text-decoration: underline; font-weight: bold;">Acceder/Registrarse</a>

            <a href="perfil.html" id="userDisplayLink" style="text-decoration: none; display: none;">
                <div id="userAvatar" style="width: 40px; height: 40px; background-color: #e91e63; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; margin-left: 15px; border: 2px solid white;"></div>
            </a>
            <a href="#" id="btnLogout" style="font-size: 14px; color: #dc3545; display: none; margin-left: 10px; text-decoration: none;">Salir</a>
        </nav>
    </header>

    <div class="main-content d-flex align-items-center justify-content-center" style="min-height: 80vh;">
        <main class="form-signin text-center p-4 shadow rounded bg-white" style="max-width: 400px; width: 100%;">
            <form id="formRegister">
                <img class="mb-4" src="Imagenes/logo.jpg" alt="Logo" width="70">
                
                <h1 class="h3 mb-3 fw-normal">Crear Cuenta</h1>

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="regNombre" placeholder="Tu Nombre" required>
                    <label for="regNombre" style="color: #666;">Nombre Completo</label>
                </div>

                <div class="form-floating mb-2">
                    <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required>
                    <label for="regEmail" style="color: #666;">Correo Electrónico</label>
                </div>
                
                <div class="form-floating mb-2">
                    <input type="password" class="form-control" id="regPassword" placeholder="Password" required>
                    <label for="regPassword" style="color: #666;">Contraseña</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="regConfirmPassword" placeholder="Confirm Password" required>
                    <label for="regConfirmPassword" style="color: #666;">Confirmar Contraseña</label>
                </div>

                <div id="registerErrorMsg" class="text-danger text-center mb-3 fw-bold" style="display: none; font-size: 0.9rem;"></div>

                <button class="w-100 btn btn-lg btn-primary" type="submit" style="background-color: #342ead;">Registrarse</button>
                
                <p class="mt-3 mb-3 text-muted">¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></p>
                <a href="index.html" class="text-decoration-none">← Volver al inicio</a>
            </form>
        </main>
    </div>

    <button class="btn btn-primary btn-config" data-bs-toggle="modal" data-bs-target="#modalConfig">⚙️</button>

    <div class="modal fade" id="modalConfig" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" style="color:black">Configuración</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body" style="color:black">
                    <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="switchDarkMode"><label class="form-check-label" for="switchDarkMode">Modo Oscuro</label></div>
                    <div class="mb-3"><label class="form-label">Tamaño de letra</label><input type="range" class="form-range" min="1" max="3" step="1" id="rangeFontSize"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Script/Script.js"></script>

</body>
</html>
